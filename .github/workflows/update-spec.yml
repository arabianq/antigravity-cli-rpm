name: Update Spec File

on:
  schedule:
    # Run everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Spec File
        run: |
          # The script fetches the latest version and overwrites agy.spec
          bash ./generate_spec.sh

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agy.spec
          # Extract version from spec file for the commit message
          VERSION=$(grep '^Version:' agy.spec | awk '{print $2}')
          git commit -m "chore: update agy.spec to version $VERSION"
          git push
